services:
  api:
    build: .
    command: python -m uvicorn flood_command_center.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env

  dashboard:
    build: .
    command: python -m streamlit run src/flood_command_center/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
      PYTHONPATH: /app/src
    env_file:
      - .env
    depends_on:
      - api
